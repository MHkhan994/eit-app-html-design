<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETI-App — এগ ম্যাস হিসাব করুন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div>
  <div class="device">
    <div class="screen">
      <div class="status-bar"><span>8:59 PM</span><span>●●● 18%</span></div>

      <div class="subpage-header" style="background:var(--rust);">
        <a class="back-btn" href="index.html">←</a>
        <h1>ফ্লকের Egg Mass হিসাব করুন</h1>
      </div>

      <div class="screen-body">
        <div class="calc-card">
          <div class="calc-field">
            <label>ডিম উৎপাদন হার (%)</label>
            <input class="calc-input" type="text" placeholder="ডিম উৎপাদন % লিখুন">
          </div>
          <div class="calc-field">
            <label>ডিমের গড় ওজন (g)</label>
            <input class="calc-input" type="text" placeholder="ডিমের গড় ওজন লিখুন">
          </div>
          <div class="calc-field">
            <label>মুরগির বয়স (Week)</label>
            <input class="calc-input" type="text" placeholder="মুরগির বয়স লিখুন">
          </div>
          <div class="calc-btn-row" style="margin-top:14px;">
            <button class="calc-btn rust" type="button">ফলাফল জানুন</button>
            <button class="calc-btn moss" type="button">মুছুন</button>
          </div>
        </div>

        <div class="info-block">
          <div class="info-row"><div class="info-label">বর্তমান Egg Mass:</div><div class="info-value strong">56.00 g</div></div>
          <div class="info-row"><div class="info-label">স্ট্যান্ডার্ড সীমা:</div><div class="info-value">ডাটা নেই</div></div>
          <div class="info-row"><div class="info-label">ফ্লকের বর্তমান অবস্থা:</div><div class="info-value">এই বয়সের কোনও স্ট্যান্ডার্ড ডাটা নাই।</div></div>
          <div class="info-row"><div class="info-label">সংক্ষিপ্ত পরামর্শঃ</div><div class="info-value">বয়স অনুযায়ী সঠিক স্ট্যান্ডার্ড ডাটা যোগ করুন।</div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="caption">ETI-App prototype · static mockup, calculator not wired up yet</div>
</div>
</body>
</html>
