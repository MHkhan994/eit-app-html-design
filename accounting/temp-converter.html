<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETI-App — Temperature Unit Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div>
  <div class="device">
    <div class="screen">
      <div class="status-bar"><span>9:17 PM</span><span>●●● 25%</span></div>

      <div class="subpage-header" style="background:var(--moss);">
        <a class="back-btn" href="index.html">←</a>
        <h1>Temperature Unit Converter</h1>
      </div>

      <div class="screen-body">
        <div class="calc-card">
          <input class="calc-input accent" type="text" placeholder="Enter Celsius" disabled>
          <button class="calc-btn moss" type="button">CONVERT: CELSIUS → FAHRENHEIT</button>
          <input class="calc-input" type="text" placeholder="Enter Fahrenheit" disabled style="margin-top:8px;">
          <button class="calc-btn rust" type="button">CONVERT: FAHRENHEIT → CELSIUS</button>
          <button class="calc-btn dark" type="button">CLEAR</button>
        </div>

        <div class="result-banner">40°C = 104°F</div>
      </div>
    </div>
  </div>
  <div class="caption">ETI-App prototype · static mockup, calculator not wired up yet</div>
</div>
</body>
</html>
