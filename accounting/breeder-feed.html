<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETI-App — স্কিপ ফিড প্রোগ্রাম অনুযায়ী ফিড হিসাব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div>
  <div class="device">
    <div class="screen">
      <div class="status-bar"><span>9:11 PM</span><span>●●● 23%</span></div>

      <div class="plain-header">
        <a class="back-btn" href="index.html">←</a>
        <h1>স্কিপ ফিড প্রোগ্রাম অনুযায়ী ফিড হিসাব</h1>
      </div>

      <div class="screen-body">
        <div class="calc-card">
          <input class="calc-input" type="text" placeholder="মুরগির সংখ্যা">
          <input class="calc-input" type="text" placeholder="ফিড (গ্রাম/মুরগি/দিন)" style="margin-bottom:0;">
        </div>

        <div class="field-section-label">স্কিপ ফিড প্রোগ্রাম নির্বাচন করুন</div>
        <div class="radio-col">
          <label class="radio-option"><input type="radio" name="feedprog" checked> ৭/৭ প্রোগ্রাম</label>
          <label class="radio-option"><input type="radio" name="feedprog"> ৬/৭ প্রোগ্রাম</label>
          <label class="radio-option"><input type="radio" name="feedprog"> ৫/৭ প্রোগ্রাম</label>
          <label class="radio-option"><input type="radio" name="feedprog"> ৪/৭ প্রোগ্রাম</label>
        </div>

        <div class="calc-btn-row" style="margin:16px;">
          <button class="calc-btn moss" type="button">CALCULATE</button>
          <button class="calc-btn rust" type="button">CLEAR</button>
        </div>

        <div class="info-block">
          <div class="info-row"><div class="info-label">মোট মুরগি:</div><div class="info-value strong">200</div></div>
          <div class="info-row"><div class="info-label">প্রোগ্রাম:</div><div class="info-value strong">৭/৭ প্রোগ্রাম</div></div>
          <div class="info-row"><div class="info-label">ফিড/মুরগি/দিন:</div><div class="info-value strong">20 g</div></div>
          <div class="info-row"><div class="info-label">মোট ফিড/দিন:</div><div class="info-value strong">4.00 kg</div></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
