<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETI-App — মুরগীর ওজন ও ইউনিফির্মিটি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div>
  <div class="device">
    <div class="screen">
      <div class="status-bar"><span>8:44 PM</span><span>●●● 12%</span></div>

      <div class="subpage-header" style="background:var(--rust);">
        <a class="back-btn" href="index.html">←</a>
        <h1>মুরগীর ওজন ও ইউনিফির্মিটি</h1>
      </div>

      <div class="screen-body">
        <div class="calc-card">
          <div class="calc-hint">একটি করে ওজন (g) যোগ করুন</div>
          <input class="calc-input" type="text" placeholder="১টি করে ওজন লিখুন" disabled>
          <button class="calc-btn moss" type="button">যোগ করতে ক্লিক করুন</button>
          <button class="calc-btn rust" type="button">ফলাফল জানুন</button>
          <button class="calc-btn moss" type="button">ফলাফল মুছুন</button>
        </div>

        <div class="calc-results">
          <div class="calc-result-row"><span class="label">মোট ওজন :</span><span class="value">0</span></div>
          <div class="calc-result-row"><span class="label">ওজনকৃত মুরগীর সংখ্যা :</span><span class="value">0</span></div>
          <div class="calc-result-row"><span class="label">গড় ওজন :</span><span class="value">0</span></div>
          <div class="calc-result-row"><span class="label">গড় ওজনের ১০% (+) :</span><span class="value">0</span></div>
          <div class="calc-result-row"><span class="label">গড় ওজনের ১০% (-) :</span><span class="value">0</span></div>
          <div class="calc-result-row"><span class="label">Uniformity (%) :</span><span class="value">0</span></div>
          <div class="calc-result-row"><span class="label">CV (%) :</span><span class="value">0</span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="caption">ETI-App prototype · static mockup, calculator not wired up yet</div>
</div>
</body>
</html>
