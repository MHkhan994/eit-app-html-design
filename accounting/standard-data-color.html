<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETI-App — কালার বার্ড স্ট্যান্ডার্ড ডাটা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div>
  <div class="device">
    <div class="screen">
      <div class="status-bar"><span>10:30 PM</span><span>●●● 54%</span></div>

      <div class="plain-header">
        <a class="back-btn" href="standard-data.html">←</a>
      </div>

      <div class="screen-body">
        <div class="title-card">
          <div class="title-card-head"><h2>কালার বার্ড স্ট্যান্ডার্ড ডাটা</h2></div>
          <p>প্রচলিত সকল কালার বার্ড ডাটা</p>
        </div>

        <div class="calc-card">
          <div class="calc-field">
            <label>কালার মুরগির জাতঃ</label>
            <select class="calc-input calc-select">
              <option selected>Sasso Color (SA51A)</option>
            </select>
          </div>
          <div class="calc-field">
            <label>মুরগির বয়সঃ</label>
            <input class="calc-input" type="text" placeholder="Week" disabled>
          </div>
          <button class="calc-btn moss" type="button" style="margin-top:14px;">Calculate</button>
          <button class="calc-btn dark" type="button">Clear</button>
        </div>

        <div class="info-block">
          <div class="result-text">
            <p>🐓 মুরগির জাত: Sasso Color (SA51A)<br>📅 বয়স: 3 সপ্তাহ</p>
            <p>📊 Standard Data<br>• Body Weight: 440.0 g<br>• Cumulative Feed Intake: 612.0 g/bird<br>• FCR: 1.39</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="caption">ETI-App prototype · static mockup, calculator not wired up yet</div>
</div>
</body>
</html>
