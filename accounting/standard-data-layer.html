<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETI-App — কমার্শিয়াল লেয়ার স্ট্যান্ডার্ড ডাটা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div>
  <div class="device">
    <div class="screen">
      <div class="status-bar"><span>10:30 PM</span><span>●●● 54%</span></div>

      <div class="plain-header">
        <a class="back-btn" href="standard-data.html">←</a>
      </div>

      <div class="screen-body">
        <div class="title-card">
          <div class="title-card-head"><h2>কমার্শিয়াল লেয়ার স্ট্যান্ডার্ড ডাটা</h2></div>
          <p>প্রচলিত সকল লেয়ার মুরগির ডাটা</p>
        </div>

        <div class="calc-card">
          <div class="calc-field">
            <label>লেয়ার মুরগির জাত নির্বাচন</label>
            <select class="calc-input calc-select">
              <option>Shaver Brown</option>
              <option>Hi-sex White</option>
              <option selected>Hy-Line Brown</option>
              <option>Hy-Line White</option>
              <option>Novogen Brown</option>
              <option>Novogen White</option>
              <option>Dekalb White</option>
            </select>
          </div>
          <div class="calc-field">
            <label>মুরগির বয়স (সপ্তাহ)</label>
            <input class="calc-input" type="text" placeholder="Week">
          </div>
          <button class="calc-btn moss" type="button" style="margin-top:14px;">Calculate</button>
          <button class="calc-btn dark" type="button">Clear</button>
        </div>

        <div class="info-block">
          <div class="result-text">
            <p>🐓 মুরগির জাত: Hy-Line Brown<br>📅 বয়স: 5 সপ্তাহ</p>
            <p>📊 Rearing Standard Data<br>• Body Weight: 387.6 g<br>• Daily Feed: 34.0 g/day<br>• Cumulative Feed: 0.8 kg/bird</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
