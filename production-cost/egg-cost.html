<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETI-App — ১টি ডিমের উৎপাদন খরচ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div>
  <div class="device">
    <div class="screen">
      <div class="status-bar"><span>10:14 PM</span><span>●●● 11%</span></div>

      <div class="inset-header" style="background:var(--rust);">
        <a class="back-btn" href="index.html">←</a>
        <h1>১টি ডিমের উৎপাদন খরচ</h1>
      </div>

      <div class="screen-body">
        <div class="calc-card">
          <input class="calc-input" type="text" placeholder="লেয়ার বাচ্চার দাম" disabled>
          <input class="calc-input" type="text" placeholder="ফিডের দাম (টাকা/কেজি)" disabled>
          <input class="calc-input" type="text" placeholder="মোট ডিমের সংখ্যা (HH)" disabled>
          <button class="calc-btn rust" type="button">হিসাব করুন</button>
        </div>

        <div class="result-hero">
          <div class="result-label">আনুমানিক উৎপাদন খরচ</div>
          <div class="result-value">0 টাকা/ডিম</div>
        </div>
      </div>
    </div>
  </div>
  <div class="caption">ETI-App prototype · static mockup, calculator not wired up yet</div>
</div>
</body>
</html>
