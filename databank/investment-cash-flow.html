<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETI-App — Cash Flow Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div>
  <div class="device">
    <div class="screen">
      <div class="status-bar"><span>5:40</span><span>●●● 41%</span></div>

      <div class="page-head tight">
        <a class="back-btn" href="investment-project.html">←</a>
      </div>

      <div class="screen-body">
        <div class="audit-hero tight">
          <h1>Cash Flow Forecast</h1>
          <p>Bandarban Broiler Project · Broiler</p>
        </div>

        <div class="calc-card" style="margin-bottom:12px">
          <div class="std-chips" style="margin-bottom:12px">
            <span class="std-chip energy">Birds <b>2,000</b></span>
            <span class="std-chip mineral">Type <b>Operational Cash Flow</b></span>
          </div>
          <div class="cost-list" style="margin-top:0;padding-top:0;border-top:none">
            <div class="cost-row"><span>Fixed Capital</span><b>4,067,558 Tk</b></div>
            <div class="cost-row"><span>Working Capital</span><b>552,667 Tk</b></div>
            <div class="cost-total"><span>Final Operational Balance</span><b>0 Tk</b></div>
          </div>
        </div>

        <!-- Recorded state: the balance stays 0 and the app raises this message until a
             Profit Forecast has been saved. Kept rather than filled in with a made-up figure. -->
        <div class="notice" style="margin:0 16px 18px">
          <p>Please save Profit Forecast first — the operational balance stays 0 until then.</p>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
