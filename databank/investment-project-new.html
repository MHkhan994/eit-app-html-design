<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETI-App — New Investment Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div>
  <div class="device">
    <div class="screen">
      <div class="status-bar"><span>5:38</span><span>●●● 42%</span></div>

      <div class="page-head tight">
        <a class="back-btn" href="investment-dashboard.html">←</a>
      </div>

      <div class="screen-body">
        <div class="audit-hero tight">
          <h1>New Project</h1>
          <p>Set the farm, the flock size and the site</p>
        </div>

        <div class="calc-card">
          <div class="form-section-title moss"><span class="sec-icon">📝</span>Project Basics</div>

          <div class="form-label">Project Name</div>
          <input class="calc-input" type="text" placeholder="e.g. Bandarban Broiler Project">

          <div class="form-label">Select Farm Type</div>
          <select class="calc-input calc-select">
            <option selected>Broiler</option>
            <option>Color</option>
            <option>Sonali</option>
            <option>Layer</option>
            <option>Broiler Breeder</option>
            <option>Layer Breeder</option>
            <option>Color Breeder</option>
          </select>

          <div class="form-label">Select Breed Type</div>
          <select class="calc-input calc-select">
            <option>Cobb 500</option>
            <option>Ross 308</option>
            <option selected>Hubbard</option>
            <option>Indian River</option>
            <option>ISA Brown</option>
            <option>Lohmann</option>
            <option>Hy-Line</option>
            <option>Sonali</option>
            <option>Color Bird</option>
          </select>

          <div class="form-label">Bird Quantity</div>
          <input class="calc-input" type="text" placeholder="0">

          <div class="form-section-title moss" style="margin-top:18px"><span class="sec-icon">🏠</span>Farm Setup</div>

          <div class="form-label">Select House Type</div>
          <select class="calc-input calc-select">
            <option selected>Open House</option>
            <option>Control House</option>
          </select>

          <div class="form-label">Select Floor System</div>
          <select class="calc-input calc-select">
            <option selected>Deep Litter</option>
            <option>Slat System</option>
            <option>Layer Cage</option>
          </select>

          <div class="form-label">Select District</div>
          <select class="calc-input calc-select">
            <option>Bagerhat</option><option selected>Bandarban</option><option>Barguna</option>
            <option>Barishal</option><option>Bhola</option><option>Bogura</option>
            <option>Brahmanbaria</option><option>Chandpur</option><option>Chapainawabganj</option>
            <option>Chattogram</option><option>Chuadanga</option><option>Cox's Bazar</option>
            <option>Cumilla</option><option>Dhaka</option><option>Dinajpur</option>
            <option>Faridpur</option><option>Feni</option><option>Gaibandha</option>
            <option>Gazipur</option><option>Gopalganj</option><option>Habiganj</option>
            <option>Jamalpur</option><option>Jashore</option><option>Jhalokati</option>
            <option>Jhenaidah</option><option>Joypurhat</option><option>Khagrachhari</option>
            <option>Khulna</option><option>Kishoreganj</option><option>Kurigram</option>
            <option>Kushtia</option><option>Lakshmipur</option><option>Lalmonirhat</option>
            <option>Madaripur</option><option>Magura</option><option>Manikganj</option>
            <option>Meherpur</option><option>Moulvibazar</option><option>Munshiganj</option>
            <option>Mymensingh</option><option>Naogaon</option><option>Narail</option>
            <option>Narayanganj</option><option>Narsingdi</option><option>Natore</option>
            <option>Netrokona</option><option>Nilphamari</option><option>Noakhali</option>
            <option>Pabna</option><option>Panchagarh</option><option>Patuakhali</option>
            <option>Pirojpur</option><option>Rajbari</option><option>Rajshahi</option>
            <option>Rangamati</option><option>Rangpur</option><option>Satkhira</option>
            <option>Shariatpur</option><option>Sherpur</option><option>Sirajganj</option>
            <option>Sunamganj</option><option>Sylhet</option><option>Tangail</option>
            <option>Thakurgaon</option>
          </select>

          <div class="form-label">Number Of Sheds</div>
          <input class="calc-input" type="text" placeholder="0">

          <a class="calc-btn gold" href="investment-project.html">SAVE PROJECT</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
