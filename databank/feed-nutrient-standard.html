<script>
// Fills the detail modal from the tapped card's own data attributes. Display only —
// the figures are static, nothing is derived.
function openStd(btn){
  var d = btn.dataset;
  document.getElementById("std-body").innerHTML =
    "Category: " + d.cat + "<br>" +
    "Breed: " + d.breed + "<br>" +
    "Phase: " + d.phase +
    "<div class=\"fd-head\">&nbsp;</div>" +
    "Target CP: " + d.cp + "%<br>" +
    "Target ME: " + d.me + " kcal/kg<br>" +
    "Target Calcium: " + d.ca + "%<br>" +
    "Target Available Phosphorus: " + d.avp + "%<br>" +
    "Target Lysine: " + d.lys + "%<br>" +
    "Target Methionine: " + d.met + "%<br>" +
    "Max Fiber: " + d.fiber + "%";
  document.getElementById("std-modal").classList.add("open");
}
function closeStd(){ document.getElementById("std-modal").classList.remove("open"); }

// Same display-only filter as the other lists in this feature. Matches the card title, so
// "Broiler", "Layer" and "Starter" all work as the placeholder suggests.
function filterStandards(){
  var q = document.getElementById("std-search").value.trim().toLowerCase();
  var shown = 0;
  document.querySelectorAll("#std-cards .std-card").forEach(function(card){
    var hit = card.querySelector("h3").textContent.toLowerCase().indexOf(q) !== -1;
    card.style.display = hit ? "" : "none";
    if(hit) shown++;
  });
  document.getElementById("std-count").textContent = shown;
}
</script>
