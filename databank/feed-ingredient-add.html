<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETI-App — Add / Edit Ingredient</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div>
  <div class="device">
    <div class="screen">
      <div class="status-bar"><span>8:49 PM</span><span>●●● 18%</span></div>

      <div class="page-head tight">
        <a class="back-btn" href="feed-ingredient-library.html">←</a>
      </div>

      <div class="screen-body">
        <div class="audit-hero tight">
          <h1>Add / Edit Ingredient</h1>
        </div>

        <!-- Fields sit straight on the background here — no white .calc-card wrapper, and no
             labels either, placeholder-only, exactly as the original renders this form. -->
        <div class="form-tight" style="padding:4px 16px 18px">
          <input class="calc-input" type="text" placeholder="Ingredient Name">

          <div class="field-row">
            <input class="calc-input" type="text" placeholder="CP %">
            <input class="calc-input" type="text" placeholder="ME kcal/kg">
          </div>
          <div class="field-row">
            <input class="calc-input" type="text" placeholder="Calcium %">
            <input class="calc-input" type="text" placeholder="Av. Phosphorus %">
          </div>
          <div class="field-row">
            <input class="calc-input" type="text" placeholder="Lysine %">
            <input class="calc-input" type="text" placeholder="Methionine %">
          </div>
          <div class="field-row">
            <input class="calc-input" type="text" placeholder="Fiber %">
            <input class="calc-input" type="text" placeholder="Fat %">
          </div>

          <input class="calc-input" type="text" placeholder="Price Tk/kg">

          <a class="calc-btn moss" href="feed-ingredient-library.html">Save Ingredient</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
