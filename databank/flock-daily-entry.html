<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETI-App — Daily Flock Data Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div>
  <div class="device">
    <div class="screen">
      <div class="status-bar"><span>7:30 AM</span><span>●●● 25%</span></div>

      <div class="plain-header">
        <a class="back-btn" href="flock-data-management.html">←</a>
        <h1>Layer-JG - Daily Entry - Rearing Mode (0 wk)</h1>
      </div>

      <div class="screen-body">
        <div class="calc-card">
          <input class="calc-input" type="text" value="2026-08-03">
          <input class="calc-input" type="text" placeholder="Feed Kg">
          <div class="form-hint ink">Opening Bird: 1</div>
          <input class="calc-input" type="text" placeholder="Mortality">
          <input class="calc-input" type="text" placeholder="Culling / Sale">
          <div class="form-hint">Closing Bird: 1</div>
          <input class="calc-input" type="text" placeholder="Remarks">
          <button class="calc-btn gold" type="button">SAVE DAILY ENTRY</button>
        </div>
      </div>
    </div>
  </div>
  <div class="caption">ETI-App prototype · static mockup, opening/closing bird counts are from the recording</div>
</div>
</body>
</html>
