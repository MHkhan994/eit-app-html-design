<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETI-App — পোস্ট তৈরি করুন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div>
  <div class="device">
    <div class="screen">
      <div class="status-bar"><span>5:54</span><span>●●● 38%</span></div>

      <div class="create-head">
        <a class="close-btn" href="index.html">✕</a>
        <h1>পোস্ট তৈরি করুন</h1>
        <a class="post-btn" href="index.html">পোস্ট</a>
      </div>

      <div class="screen-body">
        <div class="calc-card">
          <div class="compose-author">
            <div class="avatar moss">FI</div>
            <div>
              <div class="post-name">MD FARUKUL ISLAM</div>
              <select class="audience-select">
                <option selected>🌐 সবাই</option>
                <option>👥 শুধু বন্ধুরা</option>
                <option>🔒 শুধু আমি</option>
              </select>
            </div>
          </div>

          <textarea class="post-textarea" placeholder="আপনার মনে কী চলছে…?"></textarea>

          <div class="drop-zone">
            <div class="dz-ico">🖼️</div>
            <p>ছবি বা ভিডিও যোগ করুন</p>
            <span>খামারের ছবি দিলে পোস্টে সাড়া বেশি পাওয়া যায়</span>
          </div>
        </div>
      </div>

      <div class="attach-row">
        <button class="attach-btn" type="button"><span class="attach-ico" style="background:var(--moss-soft)">🖼️</span>ছবি</button>
        <button class="attach-btn" type="button"><span class="attach-ico" style="background:var(--gold-soft)">📎</span>ফাইল</button>
        <button class="attach-btn" type="button"><span class="attach-ico" style="background:var(--rust-soft)">👥</span>ট্যাগ</button>
        <button class="attach-btn" type="button"><span class="attach-ico" style="background:var(--indigo-soft)">📷</span>ক্যামেরা</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
